services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fastapi
      POSTGRES_PASSWORD: irhad
      POSTGRES_DB: fastapi_products
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:7
    container_name: fastapi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    
  api:
    build: .
    container_name: fastapi-api
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data: