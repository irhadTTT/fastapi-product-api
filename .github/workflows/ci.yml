name: StockFlow CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop


jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      TESTING: "True"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fastapi
          POSTGRES_PASSWORD: irhad
          POSTGRES_DB: fastapi_products_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fastapi"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379


    env:
      DATABASE_URL: postgresql://fastapi:irhad@localhost:5432/fastapi_products_test
      SECRET_KEY: test_secret_key
      ALGORITHM: HS256

      MAIL_USERNAME: test@example.com
      MAIL_PASSWORD: test_password
      MAIL_FROM: test@example.com
      MAIL_FROM_NAME: StockFlow
      MAIL_SERVER: smtp.gmail.com
      MAIL_PORT: 587
      FRONTEND_URL: http://localhost:3000


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run database migrations
        run: |
          alembic -c alembic.ini upgrade head


      - name: Run Ruff linting
        run: |
          ruff check .


      - name: Check Ruff formatting
        run: |
          ruff format --check .

      - name: Run tests
        run: |
          pytest -v
          - name: Debug TESTING
            run: echo "TESTING=$TESTING"

      - name: Run tests
        run: |
          pytest -v

